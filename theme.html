<!DOCTYPE html>
<!-- theme v2.2 (지침 v2.2) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--TITLE--></title>
<style>
:root{
  --ink:#1F2933;--ink2:#52606D;--line:#D9DEE5;--page:#fff;--bg:#EEF1F5;
  --prof:#C0262D;--prof-t:#FDECEC;      /* 1순위 [출제 언급] */
  --detail:#C2570C;--detail-t:#FFF0E2;  /* 1순위 [자세히 설명] */
  --skip:#7B8794;--skip-t:#F0F2F5;      /* [출제 제외 언급] */
  --same:#2F3FA8;--same-t:#ECEFFD;      /* 2순위 동일 교수 기출 */
  --diff:#64748B;--diff-t:#F1F4F8;      /* 2순위 비동일·미상 기출 */
  --slide:#1E7F4F;--slide-t:#E8F6EE;    /* 3순위 강의자료 표기·그림·표 */
  --hl:#FFF176;                         /* 형광펜 표기(라벨 없이 서식만) */
  --ai:#6D3FC4;--ai-t:#F4EFFD;          /* AI 추정 (점선) */
  --must:#0F766E;--must-t:#E3F6F4;      /* [필수 이해] */
  --trap:#B4236E;--trap-t:#FDEAF3;      /* [놓치기 쉬운 포인트] */
  --flag:#8A5A00;--flag-t:#FFF6D6;      /* ⚠ 확인 필요 */
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.8;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:860px;margin:0 auto;background:var(--page);padding:44px 56px 96px}

/* 제목부 */
h1{font-size:1.7rem;line-height:1.35;letter-spacing:-.02em;margin:0 0 6px}
.meta{color:var(--ink2);font-size:.9rem;margin:0 0 26px}
h2{font-size:1.3rem;line-height:1.4;letter-spacing:-.015em;margin:68px 0 18px;padding-top:18px;border-top:2px solid var(--ink)}
h3{font-size:1.06rem;line-height:1.5;margin:34px 0 10px}
section>p,section>ul,section>ol{margin:0 0 16px}
section>ul,section>ol{padding-left:1.35em}
section li{margin:0 0 6px}
.pg{display:inline-block;font-size:.74rem;font-weight:600;color:var(--ink2);border:1px solid var(--line);
  border-radius:4px;padding:0 6px;margin-left:8px;line-height:1.7;vertical-align:middle;white-space:nowrap;letter-spacing:0}
a{color:var(--same)}

/* 라벨 칩: 실선 채움 = 출처에 근거 / 점선 = AI 추정 */
.lb{display:inline-block;font-size:.78rem;font-weight:700;line-height:1.55;padding:0 7px;border-radius:4px;
  color:#fff;background:var(--c,var(--ink2));white-space:nowrap;margin-right:6px;letter-spacing:0;vertical-align:.06em}
.lb.in{font-size:.68rem;margin:0 2px 0 4px;vertical-align:.18em}
.lb.o{background:transparent;color:var(--c,var(--ink2));border:1.5px dashed var(--c,var(--ink2));line-height:1.4}
.c-prof{--c:var(--prof)}.c-detail{--c:var(--detail)}.c-skip{--c:var(--skip)}.c-same{--c:var(--same)}.c-diff{--c:var(--diff)}
.c-slide{--c:var(--slide)}.c-ai{--c:var(--ai)}.c-must{--c:var(--must)}.c-trap{--c:var(--trap)}.c-flag{--c:var(--flag)}

/* 박스 공통 */
.box{--c:var(--ink2);--t:#F5F7FA;margin:24px 0;padding:14px 20px 16px;background:var(--t);
  border-left:5px solid var(--c);border-radius:0 8px 8px 0}
.box>p,.box>ul,.box>ol{margin:0 0 10px}
.box>ul{padding-left:1.3em}
.box>:last-child{margin-bottom:0}
.box>.hd{font-weight:700;color:var(--c);margin:0 0 8px}
.p1{--c:var(--prof);--t:var(--prof-t)}
.p1d{--c:var(--detail);--t:var(--detail-t)}
.skip{--c:var(--skip);--t:var(--skip-t);color:var(--ink2)}
.fig,.tbl{--c:var(--slide);--t:var(--slide-t)}
.must{--c:var(--must);--t:var(--must-t)}
.trap{--c:var(--trap);--t:var(--trap-t)}
.flag{--c:var(--flag);--t:var(--flag-t);font-size:.93rem}
.ai{--c:var(--ai);--t:var(--ai-t);border:1.5px dashed var(--c);border-radius:8px}
.qt{break-inside:avoid;margin:8px 0 10px;padding:6px 12px;border-left:3px solid var(--c,var(--ink2));background:rgba(255,255,255,.7);font-size:.95rem}
.qt::before{content:"강의록";font-size:.7rem;font-weight:700;color:var(--ink2);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;margin-right:7px;background:#fff;letter-spacing:0}
.why{font-size:.87rem;color:var(--ink2);margin:0 0 8px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:10px 0 12px}
ol.steps>li{break-inside:avoid;counter-increment:s;position:relative;padding-left:34px;margin:0 0 8px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:.28em;width:22px;height:22px;border-radius:50%;
  background:var(--c,var(--ink));color:#fff;font-size:.76rem;font-weight:700;line-height:22px;text-align:center}
.ask{margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:.95rem}
.ask::before{content:"시험에서는 ";font-weight:700;color:var(--c,var(--ink))}

/* 강의자료 표기(본문 인라인) */
b.bd{font-weight:800;box-shadow:inset 0 -2px 0 var(--slide)}
mark.hl{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.hand{color:#1D4ED8;background:#EAF1FF;padding:0 4px;border-radius:3px}

/* 기출 카드 */
.q{--c:var(--same);--t:var(--same-t);margin:28px 0;border:1.5px solid var(--c);border-radius:10px;overflow:hidden}
.q.diff{--c:var(--diff);--t:var(--diff-t)}
.q>.qh{background:var(--c);color:#fff;padding:6px 16px;font-size:.86rem;font-weight:700;display:flex;gap:4px 12px;flex-wrap:wrap}
.q>.qh span{font-weight:500;opacity:.92}
.q>.qb{padding:16px 18px 8px;background:var(--t);break-inside:avoid}
.q .stem{font-weight:600;margin:0 0 10px}
.q ol.opt{list-style:none;padding:0;margin:0 0 8px}
.q ol.opt>li{margin:0;padding:2px 0}
details.ans{border-top:1px dashed var(--c);background:#fff;padding:0 18px}
details.ans>summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--c);list-style:none}
details.ans>summary::-webkit-details-marker{display:none}
details.ans>summary::before{content:"▸ "}
details.ans[open]>summary::before{content:"▾ "}
details.ans>p,details.ans>ul,details.ans>ol{margin:0 0 12px}
details.ans>h4{font-size:.92rem;margin:16px 0 6px;color:var(--c)}
details.ans>.box{margin:14px 0}
.key{font-weight:800}
ul.optx{list-style:none;padding:0}
ul.optx>li{margin:0 0 6px;padding-left:1.7em;text-indent:-1.7em}
ul.optx>li.ok{font-weight:600}

/* 표 */
.tw{overflow-x:auto;margin:18px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.55}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;background:#fff}
thead th{background:#EDF0F4;font-weight:700}
tbody th{background:#F7F8FA;font-weight:700;white-space:nowrap}
td.dif{background:#FFF9DB;font-weight:600}
table.cover{font-size:.84rem}

/* 범례 · 큰 그림 · 인출 연습 */
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin:0 0 30px;padding:14px 16px;
  border:1px solid var(--line);border-radius:8px;font-size:.84rem;line-height:1.7}
.legend div{display:flex;gap:4px;align-items:baseline}
.big{margin:0 0 8px;padding:16px 20px;background:#F5F7FA;border-radius:8px}
.big>p{margin:0 0 8px}.big>:last-child{margin-bottom:0}
.recall{margin:34px 0;padding:18px 22px 10px;border:1.5px solid var(--ink);border-radius:10px}
.recall>h3{margin:0 0 12px}
.recall>ol{margin:0;padding-left:1.3em}
.recall li{margin:0 0 12px;break-inside:avoid}
.recall details{margin-top:4px}
.recall summary{cursor:pointer;color:var(--ink2);font-size:.9rem}

/* 강의자료 쪽 이미지 (각 쪽 설명의 맨 앞) */
figure.slide{margin:24px 0 12px;padding:8px 8px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;break-inside:avoid}
figure.slide img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
figure.slide figcaption{margin:6px 2px 0;font-size:.8rem;color:var(--ink2)}
figure.slide figcaption::before{content:"▤ "}
figure.slide.zoom{position:fixed;inset:0;z-index:50;margin:0;padding:12px;border:0;border-radius:0;
  background:rgba(15,20,30,.93);display:flex;flex-direction:column;align-items:center;justify-content:center}
figure.slide.zoom img{width:auto;max-width:100%;max-height:calc(100% - 30px);border:0;cursor:zoom-out}
figure.slide.zoom figcaption{color:#fff}
/* 기출 그림 (기출 카드 안, 발문 앞): figure.slide.exam — 기출그림_[과목].pdf 의 쪽을 삽입 */
figure.slide.exam{margin:0 0 14px;background:#fff}
figure.slide.exam figcaption::before{content:"▣ "}
figure.slide.exam img{width:auto;max-width:100%;max-height:440px;margin:0 auto;cursor:zoom-in}

/* 요약·핵심 개념 노트 (note_kit.py — v2.1) */
.ns{margin:0 0 30px}
.ns>h3{margin:30px 0 10px}
.ns>ul{padding-left:1.35em;margin:0 0 10px}
.ns>ul>li{margin:0 0 6px}
.ns>p{margin:0 0 10px}
a.ref{display:inline-block;font-size:.72rem;font-weight:600;line-height:1.6;color:var(--ink2);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;margin:0 1px 0 3px;text-decoration:none;white-space:nowrap;vertical-align:.08em;letter-spacing:0}
a.ref.p1{color:var(--prof);border-color:var(--prof)}
a.ref.q{color:var(--same);border-color:var(--same)}
p.easy{padding:8px 14px;background:var(--must-t);border-left:3px solid var(--must);border-radius:0 6px 6px 0}
p.easy>strong:first-child{color:var(--must);margin-right:4px}
.ns>p.exam{padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:.95rem}
.ns>p.exam>strong:first-child{color:var(--prof);margin-right:4px}
.imp{display:inline-block;font-size:.72rem;font-weight:700;line-height:1.6;color:#fff;background:var(--c);border-radius:999px;
  padding:0 8px;margin-right:6px;vertical-align:.08em;white-space:nowrap;letter-spacing:0}
.imp.hi,.cc.hi{--c:var(--prof)}.imp.md,.cc.md{--c:var(--slide)}.imp.lo,.cc.lo{--c:var(--skip)}
.cc{margin:18px 0;padding:12px 18px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 8px 8px 0;break-inside:avoid}
.cc>.hd{font-weight:700;margin:0 0 4px}
.cc .en{font-weight:500;color:var(--ink2)}
details.cb>summary{cursor:pointer;color:var(--ink2);font-size:.82rem;list-style:none;margin:0 0 6px}
details.cb>summary::-webkit-details-marker{display:none}
details.cb>summary::before{content:"▸ "}
details.cb[open]>summary::before{content:"▾ "}
details.cb>p,details.cb>ul{margin:0 0 8px}
details.cb>ul.kp{padding-left:1.3em}
details.cb>.pit>strong{color:var(--trap)}
details.cb>.basis{font-size:.85rem;color:var(--ink2);margin-bottom:0}
table.cc-idx td,table.cc-idx th{vertical-align:middle}
table.cc-idx a{text-decoration:none}
body.exam details.cb{display:none}

/* 학습팩 (v2.2) — 마인드맵(note_kit.py 가 그린 정적 SVG) */
[hidden]{display:none!important}
.mm{overflow-x:auto;margin:14px 0 8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#FBFCFD}
.mm-svg{display:block;width:100%;min-width:620px;height:auto;font-family:inherit}
.mm-e{fill:none;stroke:#B8C2CE;stroke-width:1.4}
.mm-n rect{fill:#fff;stroke:var(--c,var(--ink2));stroke-width:1.4}
.mm-n text{fill:var(--ink);font-size:12.5px}
.mm-r rect{fill:var(--ink);stroke:var(--ink)}.mm-r text{fill:#fff;font-size:14px;font-weight:700}
.mm-s text{font-size:12.5px;font-weight:700}
.mm-c.hi{--c:var(--prof)}.mm-c.md{--c:var(--slide)}.mm-c.lo{--c:var(--skip)}
.mm-c.hi rect{fill:var(--prof-t)}.mm-c.md rect{fill:var(--slide-t)}.mm-c.lo rect{fill:var(--skip-t)}
.mm a:hover rect{stroke-width:2.6}
.mm-l{fill:none;stroke:var(--ai);stroke-width:1.3;stroke-dasharray:4 3}
.mm-a{fill:var(--ai)}
.mm-k circle{fill:#fff;stroke:var(--ai);stroke-width:1.2}.mm-k text{fill:var(--ai);font-size:10px;font-weight:700}
ol.mm-links{margin:6px 0 0;padding-left:1.6em;font-size:.92rem}
ol.mm-links li{margin:0 0 4px}
ol.mm-links a{text-decoration:none}

/* 퀴즈 채점 — 노트 퀴즈(.q.nq) · 기출 카드 · 복습 시험지 공통. 답은 data-ans 또는 답 칸의 span.key(①…) */
.q.nq{--c:var(--must);--t:var(--must-t)}
.q.live ol.opt>li{cursor:pointer;border-radius:6px;padding:3px 8px;margin:0 -8px}
.q.live ol.opt>li:hover{background:rgba(255,255,255,.8)}
.q ol.opt>li.pick{background:rgba(47,63,168,.1)}
.q ol.opt>li.pick-ok{background:#E3F6EA;font-weight:600}
.q ol.opt>li.pick-ng{background:#FDECEC;text-decoration:line-through;text-decoration-color:var(--prof)}
.q ol.opt>li.is-ans{box-shadow:inset 3px 0 0 var(--slide)}
.q.done-ok>.qh::after{content:"✓ 맞힘";margin-left:auto}
.q.done-ng>.qh::after{content:"✕ 틀림";margin-left:auto}
.q .sa{display:flex;gap:6px;margin:4px 0 10px}
.q .sa input{flex:1;min-width:0;font:inherit;padding:3px 8px;border:1px solid var(--line);border-radius:6px}
.q .sa button{font:inherit;padding:2px 14px;border:1px solid var(--c);border-radius:999px;background:#fff;color:var(--c);cursor:pointer}
body.f-ng main>:not(h1):not(h2):not(section):not(.q.done-ng),body.f-ng section>:not(h2):not(.q.done-ng){display:none}
body.exam .q .sa{display:none}

/* 카드 복습 — 핵심 개념 카드(div.cc)를 플래시카드로(스크립트가 만든다) */
.fc{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,20,30,.55)}
.fc-box{width:min(660px,100%);max-height:100%;overflow:auto;background:#fff;border-radius:14px;padding:14px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.fc-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 10px;font-size:.82rem;color:var(--ink2)}
.fc-top select,.fc-top button{font:inherit;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.fc-top .sp{margin-left:auto}
.fc-card{--c:var(--ink2);min-height:210px;padding:16px 18px;border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:10px;cursor:pointer}
.fc-card.hi{--c:var(--prof)}.fc-card.md{--c:var(--slide)}.fc-card.lo{--c:var(--skip)}
.fc-front{font-size:1.15rem;font-weight:700}
.fc-front .en{font-weight:500;color:var(--ink2)}
.fc-back{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;cursor:auto}
.fc-back p,.fc-back ul{margin:0 0 8px}.fc-back ul.kp{padding-left:1.3em}
.fc-back .pit>strong{color:var(--trap)}.fc-back .basis{font-size:.85rem;color:var(--ink2)}
.fc-tip{margin:14px 0 0;font-size:.8rem;color:var(--ink2)}
.fc-done{padding:28px 6px;text-align:center;font-size:.95rem;font-weight:500;color:var(--ink2)}
.fc-btns{display:flex;gap:8px;margin-top:12px}
.fc-btns button{flex:1;font:inherit;padding:8px;border:1.5px solid var(--c);border-radius:10px;background:#fff;color:var(--c);font-weight:700;cursor:pointer}
.fc-btns .r0{--c:var(--prof)}.fc-btns .r1{--c:var(--detail)}.fc-btns .r2{--c:var(--slide)}
.fc-btns button:disabled{opacity:.35;cursor:default}

/* 도구막대(화면 전용) */
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 16px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);font-size:.82rem}
.nojs{padding:8px 16px;background:#FFF4D6;border-bottom:1px solid #E7C56A;color:#7A5200;font-size:.82rem}
.bar .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.bar .g>span{color:var(--ink2);margin-right:2px}
.bar button{font:inherit;padding:2px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar button:focus-visible{outline:2px solid var(--same);outline-offset:2px}

/* 보기 필터 — 「교수님 강조만」은 1순위 박스와, 그 박스가 설명하는 쪽의 슬라이드(스크립트가 .kp 를 붙임)를 함께 보인다 */
body.f-p1 section>:not(h2):not(h3):not(.p1):not(.p1d):not(figure.kp){display:none}
body.f-p1 section>figure.kp{margin-top:32px}
body.f-q section>:not(h2):not(h3):not(.q){display:none}
body.hide-ai .ai{display:none}
body.exam details.ans,body.exam .recall details{display:none}

@media (max-width:720px){main{padding:28px 18px 72px}.legend{grid-template-columns:1fr}.bar{position:static}}  /* 휴대폰에서는 도구막대가 화면을 가리지 않게 고정하지 않는다 */
@page{size:A4;margin:14mm 13mm}
@media print{
  html{font-size:10.5pt}
  p,li{orphans:3;widows:3}
  body{background:#fff}
  main{max-width:none;padding:0}
  .bar,.nojs,.fc,.q .sa{display:none!important}
  figure.slide.zoom{position:static;padding:8px;background:#fff;display:block}
  figure.slide.zoom img{width:100%;max-height:none}
  figure.slide.zoom figcaption{color:var(--ink2)}
  h2,h3,.hd{break-after:avoid}
  h2{margin-top:36pt}
  tr{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="보기 설정">
  <div class="g"><span>보기</span>
    <button data-f="" aria-pressed="true">전체</button>
    <button data-f="f-p1" aria-pressed="false">교수님 강조만</button>
    <button data-f="f-q" aria-pressed="false">기출만</button>
    <button id="aiT" aria-pressed="false">AI 추정 숨기기</button>
  </div>
  <div class="g"><span>정답</span>
    <button id="ansO" aria-pressed="false">모두 펼치기</button>
    <button id="ansC" aria-pressed="true">모두 접기</button>
    <button id="exam" aria-pressed="false">시험지 모드 (정답 빼고 인쇄)</button>
  </div>
  <div class="g" id="prac" hidden><span>연습</span>
    <button id="fcB" hidden>카드 복습</button>
    <button id="ngB" aria-pressed="false" hidden>틀린 문제만</button>
    <button id="rsB" hidden>다시 풀기</button>
    <span id="qzS"></span>
  </div>
</div>
<noscript><div class="nojs">이 뷰어는 스크립트를 실행하지 않아 위 버튼이 동작하지 않는다. 정답은 각 ▸ 표시를 눌러 펼칠 수 있고, 버튼을 쓰려면 Safari·Chrome 같은 브라우저로 열면 된다.</div></noscript>

<template id="legend">
<div class="legend" aria-label="라벨 범례">
  <div><span class="lb c-prof">[출제 언급]</span>교수님이 시험·중요성을 직접 말함 (인용 필수)</div>
  <div><span class="lb c-detail">[자세히 설명]</span>교수님이 유독 길게·반복해서 설명</div>
  <div><span class="lb c-same">[OOO 교수님 - 동일]</span>현재 담당 교수가 낸 기출</div>
  <div><span class="lb c-diff">[OOO 교수님 - 비동일]</span>다른 교수가 낸 기출</div>
  <div><b class="bd">굵은 글씨</b> · <mark class="hl">형광펜</mark> · <span class="hand">필기</span>&nbsp;강의자료 표기 (라벨 없이 서식만 — 원본은 각 쪽 슬라이드)</div>
  <div><span class="lb c-slide">[그림 해설]</span><span class="lb c-slide">[표 해설]</span>그림·표 읽는 법</div>
  <div><span class="lb o c-ai">[예상 출제 포인트]</span><span class="lb o c-ai">[누락 출제 포인트]</span>AI 추정 (점선)</div>
  <div><span class="lb c-must">[필수 이해]</span><span class="lb c-trap">[놓치기 쉬운 포인트]</span>이해 보조</div>
  <div><span class="lb c-skip">[출제 제외 언급]</span>교수님이 안 낸다고 함</div>
  <div><span class="lb c-flag">⚠ 확인 필요</span>AI가 확신 못 하는 부분 — 직접 검증</div>
</div>
</template>

<script>
(function(){
  var B=document.body,fs=[].slice.call(document.querySelectorAll('[data-f]'));
  fs.forEach(function(b){b.onclick=function(){
    B.classList.remove('f-p1','f-q'); if(b.dataset.f)B.classList.add(b.dataset.f);
    fs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});};});
  function tog(id,cls){var el=document.getElementById(id);el.onclick=function(){el.setAttribute('aria-pressed',B.classList.toggle(cls))};}
  tog('aiT','hide-ai');tog('exam','exam');
  /* 정답 펼치기·접기: 두 버튼이 현재 상태를 보여 준다(모두 열림 → 펼치기 검정, 모두 닫힘 → 접기 검정, 섞이면 둘 다 흰색) */
  var O=document.getElementById('ansO'),C=document.getElementById('ansC');
  function dets(){return [].slice.call(document.querySelectorAll('details'))}
  function sync(){var ds=dets(),n=ds.filter(function(d){return d.open}).length;
    O.setAttribute('aria-pressed',ds.length>0&&n===ds.length);C.setAttribute('aria-pressed',n===0)}
  function ans(o){dets().forEach(function(d){d.open=o});sync()}
  O.onclick=function(){ans(true)};C.onclick=function(){ans(false)};
  document.addEventListener('toggle',sync,true);sync();
  /* 「교수님 강조만」: 1순위 박스마다 앞쪽 형제 중 가장 가까운 슬라이드(= 그 박스가 설명하는 쪽)에 .kp 를 붙여 함께 보이게 한다.
     h2·다른 섹션을 넘어가지 않는다. 박스가 여럿이어도 슬라이드는 한 번만 보인다 */
  [].forEach.call(document.querySelectorAll('section>.p1,section>.p1d'),function(b){
    for(var e=b.previousElementSibling;e&&e.tagName!=='H2';e=e.previousElementSibling){
      if(e.matches('figure.slide')&&!e.classList.contains('exam')){e.classList.add('kp');break}}});
  /* 노트의 쪽·박스 링크: 이 파일에 그 자리가 없으면(노트를 따로 연 경우) 그 쪽이 든 Part 파일(data-file)로 연다.
     병합본에서는 build_part.py 가 링크를 그 Part의 id로 바꿔 두므로 그대로 이 파일 안에서 움직인다 */
  [].forEach.call(document.querySelectorAll('a[data-file]'),function(a){var h=a.getAttribute('href');
    if(a.dataset.file&&h&&h.charAt(0)==='#'&&!document.getElementById(decodeURIComponent(h.slice(1))))a.setAttribute('href',a.dataset.file+h)});
  /* 슬라이드 이미지: 누르면 화면 가득 확대, 다시 누르면 원래대로 */
  [].forEach.call(document.querySelectorAll('figure.slide'),function(f){f.onclick=function(){f.classList.toggle('zoom')}});
  /* 퀴즈 채점(v2.2): 기출 카드 · 노트 퀴즈 · 복습 시험지의 div.q. 정답은 data-ans="3"(둘이면 "2,4"), 없으면 답 칸 span.key 의
     ①… 또는 4) 꼴("또는"·"재검토"·"?"가 섞인 답은 채점하지 않는다). 단답은 data-short='["정답","인정 답"…]'. 보기를 누르면 채점하고 답 칸을 연다 */
  var P=document.getElementById('prac'),QS=document.getElementById('qzS'),NG=document.getElementById('ngB'),RS=document.getElementById('rsB'),
      CI='①②③④⑤⑥⑦⑧⑨⑩',live=[];
  function nrm(s){return (s||'').toLowerCase().replace(/[\s\-–—·.,()\[\]'"]/g,'')}
  function score(){var a=0,ok=0;live.forEach(function(q){if(q.classList.contains('done-ok')){a++;ok++}else if(q.classList.contains('done-ng'))a++});
    QS.textContent='퀴즈 '+a+'/'+live.length+' 풀이 · 맞힘 '+ok+(a?' ('+Math.round(ok*100/a)+'%)':'')}
  function done(q,ok){q.classList.add(ok?'done-ok':'done-ng');var d=q.querySelector('details.ans');if(d)d.open=true;score()}
  function over(q){return q.classList.contains('done-ok')||q.classList.contains('done-ng')}
  [].forEach.call(document.querySelectorAll('div.q'),function(q){
    var lis=[].slice.call(q.querySelectorAll('.qb ol.opt>li')),an=[],i,j;
    if(q.dataset.ans)an=q.dataset.ans.split(',').map(Number);
    else{var k=q.querySelector('details.ans .key'),kt=k?k.textContent:'';
      if(!/또는|재검토|\?/.test(kt)){for(i=0;i<kt.length;i++){j=CI.indexOf(kt.charAt(i));if(j>=0&&an.indexOf(j+1)<0)an.push(j+1)}
        kt.replace(/(\d{1,2})\s*\)/g,function(m,d){if(an.indexOf(+d)<0)an.push(+d)})}}
    if(lis.length&&an.length&&Math.max.apply(null,an)<=lis.length){
      var pk=[];q.classList.add('live');live.push(q);
      lis.forEach(function(li,n){li.onclick=function(e){if(over(q)||e.target.closest('a'))return;
        var p=pk.indexOf(n+1);if(p>=0){pk.splice(p,1);li.classList.remove('pick');return}
        pk.push(n+1);li.classList.add('pick');if(pk.length<an.length)return;
        lis.forEach(function(l,m){if(an.indexOf(m+1)>=0)l.classList.add('is-ans');if(pk.indexOf(m+1)>=0)l.classList.add(an.indexOf(m+1)>=0?'pick-ok':'pick-ng')});
        done(q,pk.every(function(x){return an.indexOf(x)>=0}))}});
      q._reset=function(){pk=[];lis.forEach(function(l){l.classList.remove('pick','pick-ok','pick-ng','is-ans')})};
    }else if(q.dataset.short){
      var acc=[];try{acc=JSON.parse(q.dataset.short).map(nrm)}catch(x){}
      var qb=q.querySelector('.qb');if(!qb||!acc.length)return;
      var w=document.createElement('div');w.className='sa';w.innerHTML='<input type="text" aria-label="답 입력" autocomplete="off"><button type="button">확인</button>';
      qb.appendChild(w);q.classList.add('live');live.push(q);
      var inp=w.querySelector('input');
      var go=function(){if(!over(q)&&inp.value.trim())done(q,acc.indexOf(nrm(inp.value))>=0)};
      w.querySelector('button').onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go()};
      q._reset=function(){inp.value=''};
    }});
  if(live.length){P.hidden=NG.hidden=RS.hidden=false;score();
    NG.onclick=function(){NG.setAttribute('aria-pressed',B.classList.toggle('f-ng'))};
    RS.onclick=function(){live.forEach(function(q){q.classList.remove('done-ok','done-ng');if(q._reset)q._reset();
      var d=q.querySelector('details.ans');if(d)d.open=false});B.classList.remove('f-ng');NG.setAttribute('aria-pressed',false);score()}}
  /* 카드 복습(v2.2): 핵심 개념 카드(div.cc)를 플래시카드로 한 장씩. 상자 1~5 — 모름 → 1(이번 묶음 끝에 다시) · 애매 → 그대로 ·
     앎 → +1. 다음 복습일(0·1·3·7·21일 뒤)을 이 기기의 localStorage에 기억한다(못 쓰는 환경이면 이번 화면에서만) */
  var cc=[].slice.call(document.querySelectorAll('div.cc')),FB=document.getElementById('fcB');
  if(cc.length){P.hidden=FB.hidden=false;FB.textContent='카드 복습 ('+cc.length+')';
    var DAY=864e5,IV=[0,0,1,3,7,21],SK='fc1|'+document.title,st={};
    try{st=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(x){st={}}
    var save=function(){try{localStorage.setItem(SK,JSON.stringify(st))}catch(x){}};
    var cards=cc.map(function(el){var f=el.querySelector('.hd').cloneNode(true),b=document.createElement('div'),cb=el.querySelector('details.cb');
      [].forEach.call(f.querySelectorAll('a.ref'),function(a){a.parentNode.removeChild(a)});
      if(cb)[].forEach.call(cb.children,function(c){if(c.tagName!=='SUMMARY')b.appendChild(c.cloneNode(true))});
      var t=f.cloneNode(true);[].forEach.call(t.querySelectorAll('.imp'),function(x){x.parentNode.removeChild(x)});  /* 기억 키 = 개념 이름(중요도가 바뀌어도 이어진다) */
      return {k:t.textContent.replace(/\s+/g,' ').trim(),front:f.innerHTML,back:b.innerHTML,imp:el.classList.contains('hi')?'hi':el.classList.contains('md')?'md':'lo'}});
    var ov=document.createElement('div');ov.className='fc';ov.hidden=true;ov.setAttribute('role','dialog');ov.setAttribute('aria-label','카드 복습');
    ov.innerHTML='<div class="fc-box"><div class="fc-top"><select aria-label="카드 고르기"><option value="due">오늘 복습할 카드</option>'+
      '<option value="hi">핵심만</option><option value="all">전체</option></select><label><input type="checkbox" checked> 섞기</label>'+
      '<span class="fc-info sp"></span><button type="button" class="fc-x">닫기</button></div>'+
      '<div class="fc-card"><div class="fc-front"></div><div class="fc-back" hidden></div><p class="fc-tip">눌러서 뒤집기 (Space)</p></div>'+
      '<div class="fc-btns"><button type="button" class="r0" data-r="0">모름 (1)</button><button type="button" class="r1" data-r="1">애매 (2)</button>'+
      '<button type="button" class="r2" data-r="2">앎 (3)</button></div></div>';
    B.appendChild(ov);
    var sel=ov.querySelector('select'),mix=ov.querySelector('input'),info=ov.querySelector('.fc-info'),card=ov.querySelector('.fc-card'),
        fr=ov.querySelector('.fc-front'),bk=ov.querySelector('.fc-back'),tip=ov.querySelector('.fc-tip'),
        btn=[].slice.call(ov.querySelectorAll('.fc-btns button')),dq=[],cur=null;
    var due=function(c){var s=st[c.k];return !s||s.d<=Date.now()};
    var boxes=function(){var n=[0,0,0,0,0,0];cards.forEach(function(c){n[(st[c.k]||{}).b||0]++});return '새 카드 '+n[0]+' · 상자 1–5: '+n.slice(1).join(' / ')};
    var next=function(){cur=dq.shift()||null;bk.hidden=true;tip.hidden=false;btn.forEach(function(b){b.disabled=true});
      if(!cur){card.className='fc-card';fr.innerHTML='<div class="fc-done">지금 넘길 카드가 없다. 위에서 「전체」를 고르면 다시 넘겨 볼 수 있다.</div>';bk.innerHTML='';info.textContent=boxes();return}
      card.className='fc-card '+cur.imp;fr.innerHTML=cur.front;bk.innerHTML=cur.back;info.textContent='남은 '+(dq.length+1)+'장 · '+boxes()};
    var start=function(){var m=sel.value;dq=cards.filter(function(c){return m==='all'||(m==='hi'?c.imp==='hi':due(c))});
      if(mix.checked)for(var i=dq.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=dq[i];dq[i]=dq[j];dq[j]=t}next()};
    var flip=function(){if(cur&&bk.hidden){bk.hidden=false;tip.hidden=true;btn.forEach(function(b){b.disabled=false})}};
    var rate=function(r){if(!cur||bk.hidden)return;var s=st[cur.k]||{b:1};  /* 새 카드는 상자 1에서 시작 — 처음에 「앎」이면 상자 2(내일) */
      if(r===0){s.b=1;dq.push(cur)}else if(r===2)s.b=Math.min(5,s.b+1);else if(s.b===1)dq.push(cur)
      s.d=Date.now()+IV[s.b]*DAY;st[cur.k]=s;save();next()};
    card.onclick=function(e){if(e.target.closest('a')){ov.hidden=true;return}flip()};
    btn.forEach(function(b){b.onclick=function(){rate(+b.dataset.r)}});
    sel.onchange=start;mix.onchange=start;ov.querySelector('.fc-x').onclick=function(){ov.hidden=true};
    FB.onclick=function(){ov.hidden=false;start()};
    document.addEventListener('keydown',function(e){if(ov.hidden)return;
      if(e.key==='Escape')ov.hidden=true;else if(e.key===' '){e.preventDefault();flip()}else if(e.key==='1'||e.key==='2'||e.key==='3')rate(+e.key-1)});
  }
  /* 인쇄·PDF 변환 시 정답 자동 펼침(시험지 모드 제외) */
  function onPrint(){if(!B.classList.contains('exam'))ans(true)}
  window.addEventListener('beforeprint',onPrint);
  if(window.matchMedia){var mq=window.matchMedia('print'),h=function(e){if(e.matches)onPrint()};mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h)}
})();
</script>
