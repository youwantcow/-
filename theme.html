<!DOCTYPE html>
<!-- theme v3.1 (지침 v2.6) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><!--TITLE--></title>
<style>
:root{
  --ink:#1F2933;--ink2:#52606D;--line:#D9DEE5;--page:#fff;--bg:#EEF1F5;
  --prof:#C0262D;--prof-t:#FDECEC;      /* 1순위 [출제 언급] */
  --detail:#C2570C;--detail-t:#FFF0E2;  /* 1순위 [자세히 설명] */
  --skip:#7B8794;--skip-t:#F0F2F5;      /* [출제 제외 언급] */
  --same:#2F3FA8;--same-t:#ECEFFD;      /* 2순위 동일 교수 기출 */
  --diff:#64748B;--diff-t:#F1F4F8;      /* 2순위 비동일·미상 기출 */
  --slide:#1E7F4F;--slide-t:#E8F6EE;    /* 3순위 강의자료 표기·그림·표 */
  --hl:#FFF176;                         /* 형광펜 표기(라벨 없이 서식만) */
  --ai:#6D3FC4;--ai-t:#F4EFFD;          /* AI 추정 (점선) */
  --must:#0F766E;--must-t:#E3F6F4;      /* [필수 이해] · 쉬운 설명 */
  --trap:#B4236E;--trap-t:#FDEAF3;      /* [놓치기 쉬운 포인트] */
  --flag:#8A5A00;--flag-t:#FFF6D6;      /* ⚠ 확인 필요 */
}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.8;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere}
main,.view{max-width:860px;margin:0 auto;background:var(--page);padding:36px 48px 96px}

/* 제목부 */
h1{font-size:1.7rem;line-height:1.35;letter-spacing:-.02em;margin:0 0 6px}
.meta{color:var(--ink2);font-size:.9rem;margin:0 0 20px}
h2{font-size:1.3rem;line-height:1.4;letter-spacing:-.015em;margin:68px 0 18px;padding-top:18px;border-top:2px solid var(--ink)}
h3{font-size:1.06rem;line-height:1.5;margin:34px 0 10px}
section>p,section>ul,section>ol{margin:0 0 16px}
section>ul,section>ol{padding-left:1.35em}
section li{margin:0 0 6px}
.pg{display:inline-block;font-size:.74rem;font-weight:600;color:var(--ink2);border:1px solid var(--line);
  border-radius:4px;padding:0 6px;margin-left:8px;line-height:1.7;vertical-align:middle;white-space:nowrap;letter-spacing:0}
a{color:var(--same)}
hr{border:0;border-top:3px double var(--line);margin:72px 0 40px}

/* 라벨 칩: 실선 채움 = 출처에 근거 / 점선 = AI 추정 */
.lb{display:inline-block;font-size:.78rem;font-weight:700;line-height:1.55;padding:0 7px;border-radius:4px;
  color:#fff;background:var(--c,var(--ink2));white-space:nowrap;margin-right:6px;letter-spacing:0;vertical-align:.06em}
.lb.in{font-size:.68rem;margin:0 2px 0 4px;vertical-align:.18em}
.lb.o{background:transparent;color:var(--c,var(--ink2));border:1.5px dashed var(--c,var(--ink2));line-height:1.4}
.c-prof{--c:var(--prof)}.c-detail{--c:var(--detail)}.c-skip{--c:var(--skip)}.c-same{--c:var(--same)}.c-diff{--c:var(--diff)}
.c-slide{--c:var(--slide)}.c-ai{--c:var(--ai)}.c-must{--c:var(--must)}.c-trap{--c:var(--trap)}.c-flag{--c:var(--flag)}

/* 박스 공통 */
.box{--c:var(--ink2);--t:#F5F7FA;margin:24px 0;padding:14px 20px 16px;background:var(--t);
  border-left:5px solid var(--c);border-radius:0 8px 8px 0}
.box>p,.box>ul,.box>ol{margin:0 0 10px}
.box>ul{padding-left:1.3em}
.box>:last-child{margin-bottom:0}
.box>.hd{font-weight:700;color:var(--c);margin:0 0 8px}
.p1{--c:var(--prof);--t:var(--prof-t)}
.p1d{--c:var(--detail);--t:var(--detail-t)}
.skip{--c:var(--skip);--t:var(--skip-t);color:var(--ink2)}
.fig,.tbl{--c:var(--slide);--t:var(--slide-t)}
.must{--c:var(--must);--t:var(--must-t)}
.trap{--c:var(--trap);--t:var(--trap-t)}
.flag{--c:var(--flag);--t:var(--flag-t);font-size:.93rem}
.ai{--c:var(--ai);--t:var(--ai-t);border:1.5px dashed var(--c);border-radius:8px}
.qt{break-inside:avoid;margin:8px 0 10px;padding:6px 12px;border-left:3px solid var(--c,var(--ink2));background:rgba(255,255,255,.7);font-size:.95rem}
.qt::before{content:"강의록";font-size:.7rem;font-weight:700;color:var(--ink2);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;margin-right:7px;background:#fff;letter-spacing:0}
.why{font-size:.87rem;color:var(--ink2);margin:0 0 8px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:10px 0 12px}
ol.steps>li{break-inside:avoid;counter-increment:s;position:relative;padding-left:34px;margin:0 0 8px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:.28em;width:22px;height:22px;border-radius:50%;
  background:var(--c,var(--ink));color:#fff;font-size:.76rem;font-weight:700;line-height:22px;text-align:center}
.ask{margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:.95rem}
.ask::before{content:"시험에서는 ";font-weight:700;color:var(--c,var(--ink))}

/* 쉬운 설명 (v3) — 쪽의 핵심 요약 바로 아래. 접혀 있다가 누르면 열린다(Univ AI 「쉬운 설명 >」 자리) */
details.easy{margin:-4px 0 20px}
details.easy>summary{display:inline-block;cursor:pointer;list-style:none;color:var(--ink2);font-size:.9rem;font-weight:600;padding:2px 0}
details.easy>summary::-webkit-details-marker{display:none}
details.easy>summary::after{content:" ›";font-weight:700}
details.easy[open]>summary::after{content:" ⌄"}
details.easy>:not(summary){margin:0 0 10px}
details.easy[open]{padding:4px 0 2px 18px;border-left:3px solid var(--must)}
details.easy[open]>summary{color:var(--must)}
details.easy ol,details.easy ul{padding-left:1.35em}
details.easy li{margin:0 0 6px}
details.easy strong:first-child{color:var(--must)}

/* 강의자료 표기(본문 인라인) */
b.bd{font-weight:800;box-shadow:inset 0 -2px 0 var(--slide)}
mark.hl{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.hand{color:#1D4ED8;background:#EAF1FF;padding:0 4px;border-radius:3px}

/* 기출 카드 */
.q{--c:var(--same);--t:var(--same-t);margin:28px 0;border:1.5px solid var(--c);border-radius:10px;overflow:hidden}
.q.diff{--c:var(--diff);--t:var(--diff-t)}
.q>.qh{background:var(--c);color:#fff;padding:6px 16px;font-size:.86rem;font-weight:700;display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.q>.qh span{font-weight:500;opacity:.95}
.q>.qh a{color:inherit}
.q>.qb{padding:16px 18px 8px;background:var(--t);break-inside:avoid}
.q .stem{font-weight:600;margin:0 0 10px}
.q ol.opt{list-style:none;padding:0;margin:0 0 8px}
.q ol.opt>li{margin:0;padding:2px 0}
details.ans{border-top:1px dashed var(--c);background:#fff;padding:0 18px}
details.ans>summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--c);list-style:none}
details.ans>summary::-webkit-details-marker{display:none}
details.ans>summary::before{content:"▸ "}
details.ans[open]>summary::before{content:"▾ "}
details.ans>p,details.ans>ul,details.ans>ol{margin:0 0 12px}
details.ans>h4{font-size:.92rem;margin:16px 0 6px;color:var(--c)}
details.ans>.box{margin:14px 0}
.key{font-weight:800}
ul.optx{list-style:none;padding:0}
ul.optx>li{margin:0 0 6px;padding-left:1.7em;text-indent:-1.7em}
ul.optx>li.ok{font-weight:600}
/* 변형 예측 문제(v3) — 동일 교수 기출에서 AI가 예측한 문항(점선). 「퀴즈」 탭으로 옮겨진다 */
.q.vq{--c:var(--ai);--t:var(--ai-t);border-style:dashed}
.q.vq>.qh{background:var(--ai-t);color:var(--ai);border-bottom:1.5px dashed var(--ai)}
p.vql{font-size:.88rem;color:var(--ai);margin:0 0 12px}
p.vql a{color:var(--ai);font-weight:600}

/* 표 */
.tw{overflow-x:auto;margin:18px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.55}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;background:#fff}
thead th{background:#EDF0F4;font-weight:700}
tbody th{background:#F7F8FA;font-weight:700;white-space:nowrap}
td.dif{background:#FFF9DB;font-weight:600}
table.cover{font-size:.84rem}

/* 범례 · 큰 그림 · 인출 연습 */
details.lg{margin:0 0 22px}
details.lg>summary{cursor:pointer;color:var(--ink2);font-size:.84rem;font-weight:600;list-style:none}
details.lg>summary::-webkit-details-marker{display:none}
details.lg>summary::before{content:"▸ "}
details.lg[open]>summary::before{content:"▾ "}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin:8px 0 10px;padding:14px 16px;
  border:1px solid var(--line);border-radius:8px;font-size:.84rem;line-height:1.7}
.legend div{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.big{margin:0 0 8px;padding:16px 20px;background:#F5F7FA;border-radius:8px}
.big>p{margin:0 0 8px}.big>:last-child{margin-bottom:0}
.recall{margin:34px 0;padding:18px 22px 10px;border:1.5px solid var(--ink);border-radius:10px}
.recall>h3{margin:0 0 12px}
.recall>ol{margin:0;padding-left:1.3em}
.recall li{margin:0 0 12px;break-inside:avoid}
.recall details{margin-top:4px}
.recall summary{cursor:pointer;color:var(--ink2);font-size:.9rem}

/* 강의자료 쪽 이미지 — 좁은 화면에서는 각 쪽 설명의 맨 앞, 넓은 화면에서는 왼쪽 강의자료 칸 */
figure.slide{margin:24px 0 12px;padding:8px 8px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;break-inside:avoid}
figure.slide img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
figure.slide figcaption{margin:6px 2px 0;font-size:.8rem;color:var(--ink2)}
figure.slide figcaption::before{content:"▤ "}
figure.slide.exam{margin:0 0 14px;background:#fff}
figure.slide.exam figcaption::before{content:"▣ "}
figure.slide.exam img{width:auto;max-width:100%;max-height:440px;margin:0 auto;cursor:zoom-in}
/* 확대 보기(누르면 화면 가득, 다시 누르면 닫힘) */
#zv{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;
  background:rgba(15,20,30,.94);cursor:zoom-out}
#zv img{max-width:100%;max-height:calc(100% - 34px);object-fit:contain}
#zv p{margin:8px 0 0;color:#fff;font-size:.84rem}

/* 요약·핵심 개념 노트 (note_kit.py — v2.1) */
.ns{margin:0 0 30px}
.ns>h3{margin:30px 0 10px}
.ns>ul{padding-left:1.35em;margin:0 0 10px}
.ns>ul>li{margin:0 0 6px}
.ns>p{margin:0 0 10px}
a.ref{display:inline-block;font-size:.72rem;font-weight:600;line-height:1.6;color:var(--ink2);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;margin:0 1px 0 3px;text-decoration:none;white-space:nowrap;vertical-align:.08em;letter-spacing:0}
a.ref.p1{color:var(--prof);border-color:var(--prof)}
a.ref.q{color:var(--same);border-color:var(--same)}
p.easy{padding:8px 14px;background:var(--must-t);border-left:3px solid var(--must);border-radius:0 6px 6px 0}
p.easy>strong:first-child{color:var(--must);margin-right:4px}
.ns>p.exam{padding-top:8px;border-top:1px solid rgba(0,0,0,.08);font-size:.95rem}
.ns>p.exam>strong:first-child{color:var(--prof);margin-right:4px}
.imp{display:inline-block;font-size:.72rem;font-weight:700;line-height:1.6;color:#fff;background:var(--c);border-radius:999px;
  padding:0 8px;margin-right:6px;vertical-align:.08em;white-space:nowrap;letter-spacing:0}
.imp.hi,.cc.hi{--c:var(--prof)}.imp.md,.cc.md{--c:var(--slide)}.imp.lo,.cc.lo{--c:var(--skip)}
.cc{margin:18px 0;padding:12px 18px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:0 8px 8px 0;break-inside:avoid}
.cc>.hd{font-weight:700;margin:0 0 4px}
.cc .en{font-weight:500;color:var(--ink2)}
details.cb>summary{cursor:pointer;color:var(--ink2);font-size:.82rem;list-style:none;margin:0 0 6px}
details.cb>summary::-webkit-details-marker{display:none}
details.cb>summary::before{content:"▸ "}
details.cb[open]>summary::before{content:"▾ "}
details.cb>p,details.cb>ul{margin:0 0 8px}
details.cb>ul.kp{padding-left:1.3em}
details.cb>.pit>strong{color:var(--trap)}
details.cb>.basis{font-size:.85rem;color:var(--ink2);margin-bottom:0}
table.cc-idx td,table.cc-idx th{vertical-align:middle}
table.cc-idx tbody th{white-space:normal}
table.cc-idx td{white-space:nowrap;width:1%}
table.cc-idx a{text-decoration:none}

/* 학습팩 마인드맵(note_kit.py 가 그린 정적 SVG) — Part와 한 파일이면 숨기고 「마인드맵」 탭(아래 v3.1)이 강의 지도를 그린다. 노트만 따로 열 때 보인다 */
[hidden]{display:none!important}
.mm{overflow-x:auto;margin:14px 0 8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#FBFCFD}
.mm-svg{display:block;width:100%;min-width:620px;height:auto;font-family:inherit}
.mm-e{fill:none;stroke:#B8C2CE;stroke-width:1.4}
.mm-n rect{fill:#fff;stroke:var(--c,var(--ink2));stroke-width:1.4}
.mm-n text{fill:var(--ink);font-size:12.5px}
.mm-r rect{fill:var(--ink);stroke:var(--ink)}.mm-r text{fill:#fff;font-size:14px;font-weight:700}
.mm-s text{font-size:12.5px;font-weight:700}
.mm-c.hi{--c:var(--prof)}.mm-c.md{--c:var(--slide)}.mm-c.lo{--c:var(--skip)}
.mm-c.hi rect{fill:var(--prof-t)}.mm-c.md rect{fill:var(--slide-t)}.mm-c.lo rect{fill:var(--skip-t)}
.mm-l{fill:none;stroke:var(--ai);stroke-width:1.3;stroke-dasharray:4 3}
.mm-a{fill:var(--ai)}
.mm-k circle{fill:#fff;stroke:var(--ai);stroke-width:1.2}.mm-k text{fill:var(--ai);font-size:10px;font-weight:700}
ol.mm-links{margin:6px 0 0;padding-left:1.6em;font-size:.92rem}
/* 마인드맵 탭(v3.1) — 강의 → Part → 절(h2) → 핵심 개념(카드). theme 스크립트가 본문 절과 카드의 쪽 범위로 그린다(따로 쓰는 것 없음) */
.mmx{display:block;font-family:inherit;overflow:visible}
.mmx [data-k]{cursor:pointer}
.mmx [data-k]:focus,.mmx .mm-t:focus{outline:none}
.mmx [data-k]:hover>rect:first-of-type,.mmx [data-k]:focus>rect:first-of-type{stroke-width:2.4}
.mmx .mm-p rect{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.mmx text.r{fill:#fff;font-size:13.5px;font-weight:700}
.mmx text.rs{fill:#fff;font-size:11px;font-weight:400;opacity:.85}
.mmx text.pt,.mmx text.sm{fill:var(--ink);font-size:12.5px;font-weight:700}
.mmx text.ps{fill:var(--ink2);font-size:11px;font-weight:400}
.mmx text.ss{fill:var(--ink2);font-size:12px;font-weight:400}
.mmx text.cl{fill:var(--ink);font-size:12px;font-weight:400}
.mmx .mm-bar{stroke:none}
.mmx .b-p1 .mm-bar{fill:var(--prof)}.mmx .b-same .mm-bar{fill:var(--same)}
.mmx .mm-t{cursor:pointer}
.mmx .mm-t circle{fill:#fff;stroke:#8A96A3;stroke-width:1.2}
.mmx .mm-t:hover circle,.mmx .mm-t:focus circle{stroke:var(--ink);stroke-width:1.8}
.mmx .mm-t text{fill:var(--ink2);font-size:10px;font-weight:700}
main h1{scroll-margin-top:110px}

/* 퀴즈 채점 — 기출 카드 · 노트 퀴즈(.nq) · 변형 예측(.vq) · 복습 시험지 공통. 답은 data-ans 또는 답 칸의 span.key(①…) */
.q.nq{--c:var(--must);--t:var(--must-t)}
/* 퀴즈 탭의 번호: Part 카드 퀴즈(.pq)와 변형 예측 문제(.vq)는 탭 안에서 차례로 센다 */
#v-quiz{counter-reset:pq vq}
#v-quiz .q.pq>.qh::before{counter-increment:pq;content:counter(pq) "."}
#v-quiz .q.vq>.qh::before{counter-increment:vq;content:counter(vq) "."}
.q.live ol.opt>li{cursor:pointer;border-radius:6px;padding:3px 8px;margin:0 -8px}
.q.live ol.opt>li:hover{background:rgba(255,255,255,.8)}
.q ol.opt>li.pick{background:rgba(47,63,168,.1)}
.q ol.opt>li.pick-ok{background:#E3F6EA;font-weight:600}
.q ol.opt>li.pick-ng{background:#FDECEC;text-decoration:line-through;text-decoration-color:var(--prof)}
.q ol.opt>li.is-ans{box-shadow:inset 3px 0 0 var(--slide)}
.q.done-ok>.qh::after{content:"✓ 맞힘";margin-left:auto}
.q.done-ng>.qh::after{content:"✕ 틀림";margin-left:auto}
.q .sa{display:flex;gap:6px;margin:4px 0 10px}
.q .sa input{flex:1;min-width:0;font:inherit;padding:3px 8px;border:1px solid var(--line);border-radius:6px}
.q .sa button{font:inherit;padding:2px 14px;border:1px solid var(--c);border-radius:999px;background:#fff;color:var(--c);cursor:pointer}

/* 카드 복습(v3) — 「카드 복습」 탭: 핵심 개념 표 + 그 아래 카드 한 장씩(카드 목록은 따로 늘어놓지 않는다) */
.ccs{display:none}
table.cc-idx tbody tr{cursor:pointer}
table.cc-idx tbody tr:hover th,table.cc-idx tbody tr:hover td{background:#F5F8FF}
table.cc-idx tr.cur th,table.cc-idx tr.cur td{background:#EEF2FF}
.fcx{margin:26px 0 0;padding:14px 16px 16px;border:1.5px solid var(--line);border-radius:14px;background:#FBFCFD;scroll-margin-top:110px}
.fc-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:0 0 10px;font-size:.82rem;color:var(--ink2)}
.fc-top select,.fc-top button{font:inherit;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.fc-top .sp{margin-left:auto}
.fc-card{--c:var(--ink2);min-height:210px;padding:16px 18px;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:10px;cursor:pointer}
.fc-card.hi{--c:var(--prof)}.fc-card.md{--c:var(--slide)}.fc-card.lo{--c:var(--skip)}
.fc-front{font-size:1.15rem;font-weight:700}
.fc-front .en{font-weight:500;color:var(--ink2)}
.fc-back{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:.95rem;cursor:auto}
.fc-back p,.fc-back ul{margin:0 0 8px}.fc-back ul.kp{padding-left:1.3em}
.fc-back .pit>strong{color:var(--trap)}.fc-back .basis{font-size:.85rem;color:var(--ink2)}
.fc-tip{margin:14px 0 0;font-size:.8rem;color:var(--ink2)}
.fc-done{padding:28px 6px;text-align:center;font-size:.95rem;font-weight:500;color:var(--ink2)}
.fc-btns{display:flex;gap:8px;margin-top:12px}

/* 화면 구성(v3) — 넓은 화면(760px 이상): 왼쪽 강의자료 · 오른쪽 탭. 좁은 화면: 한 줄(쪽 이미지는 설명 맨 앞) */
#pdf,#gut{display:none}

body.split #pane{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--page);min-width:0}
body.split.nopdf #app{grid-template-columns:minmax(0,1fr)}  /* 접으면 #pdf·#gut가 빠져 #pane이 첫 칸에 놓인다 — 칸을 하나만 둔다(v3.0.1) */

.pdf-list{position:relative;flex:1;min-height:0;overflow:auto;padding:12px 12px 60vh;-webkit-overflow-scrolling:touch}
#pdf figure.slide{margin:0 0 12px;scroll-margin-top:8px;transition:box-shadow .2s}
#pdf figure.slide.on{box-shadow:0 0 0 3px var(--same)}
/* 쪽 머리(넓은 화면에서 이미지 자리에 남는 표시 — 누르면 왼쪽 칸이 그 쪽으로) */
.pslot{display:none}
body.split .pslot{display:flex;gap:8px;align-items:baseline;margin:40px 0 12px;padding:0 0 8px;border-bottom:1px solid var(--line);
  font-weight:700;font-size:1.02rem;line-height:1.5;cursor:pointer;scroll-margin-top:110px}
body.split .pslot .pg{margin:0;font-size:.8rem;color:var(--same);border-color:var(--same);flex:none}

main [id],.view [id]{scroll-margin-top:110px}

/* 탭별 보기(v3). 개념 설명 = 전부 · 교수님 강조만 = 1순위 박스 + 그 쪽 · 기출만 = 기출 카드 · 퀴즈 · 카드 복습 · 마인드맵 = 따로 모은 칸 */

@media (max-width:759px){main,.view{padding:22px 16px 72px}.legend{grid-template-columns:1fr}.bar{padding-left:10px;padding-right:10px}}

<script>
(function(){
  var D=document,B=D.body,M=D.querySelector('main');
  function $(s,r){return (r||D).querySelector(s)}
  function $$(s,r){return [].slice.call((r||D).querySelectorAll(s))}
  function pgOf(s){var m=/p\.?\s?(\d+)/.exec(s||'');return m?+m[1]:0}
  function vis(e){return !!(e&&e.getClientRects().length)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var VQ=$('#v-quiz'),VC=$('#v-cards'),PANE=$('#pane'),PL=$('#pdfL'),PI=$('#pgI'),CI='①②③④⑤⑥⑦⑧⑨⑩';
  var LS={get:function(k){try{return localStorage.getItem(k)}catch(x){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(x){}}};

  /* 0) 범례: 처음 것 하나만, 접어서 */
  var lgs=$$('main .legend');lgs.slice(1).forEach(function(x){x.parentNode.removeChild(x)});
  if(lgs[0]){var dl=D.createElement('details');dl.className='lg';dl.innerHTML='<summary>라벨 범례</summary>';lgs[0].parentNode.insertBefore(dl,lgs[0]);dl.appendChild(lgs[0])}

  /* 1) 노트(학습팩)가 Part와 한 파일에 있으면: 노트의 머리말·요약·마인드맵은 숨기고(쪽마다 핵심 요약이 그 자리를 대신한다) 카드·퀴즈만 탭으로 */
  var h1s=$$('main h1'),hasPart=h1s.some(function(h){return /Part\s*\d/.test(h.textContent)});
  if(hasPart){
    h1s.forEach(function(h){if(!/노트/.test(h.textContent))return;
      for(var e=h;e&&e.tagName!=='SECTION'&&e.tagName!=='HR';e=e.nextElementSibling){if(e!==h&&e.tagName==='H1')break;e.classList.add('nh')}});
    $$('main section[id$="nt-map"],main section[id$="nt-sum"]').forEach(function(s){s.classList.add('nh')});
  }

  /* 2) 「교수님 강조만」: 1순위 박스마다 앞쪽 형제 중 가장 가까운 쪽 이미지(= 그 박스가 설명하는 쪽)에 .kp */
  $$('main section>.p1,main section>.p1d').forEach(function(b){
    for(var e=b.previousElementSibling;e&&e.tagName!=='H2';e=e.previousElementSibling){
      if(e.matches('figure.slide')&&!e.classList.contains('exam')){e.classList.add('kp');break}}});

  /* 3) 쪽 이미지 → 쪽 머리(.pslot)를 그 자리에 남긴다. 넓은 화면에서는 이미지를 왼쪽 칸으로 옮긴다 */
  var figs=$$('main figure.slide:not(.exam)').filter(function(f){return !f.closest('.nh')}),byPg={};
  figs.forEach(function(f){var im=$('img',f),n=im&&im.getAttribute('data-page')?+im.getAttribute('data-page'):pgOf(f.id.replace(/.*pg/,'p'));
    f._pg=n;if(n&&!byPg[n])byPg[n]=f;
    var s=D.createElement('div'),cap=$('figcaption',f),t=cap?cap.textContent.replace(/^\s*강의자료\s*p\.?\s*[\d–\-~]+\s*·?\s*/,''):'';
    s.className='pslot'+(f.classList.contains('kp')?' kp':'');s._pg=n;s.setAttribute('data-pg',n);
    s.innerHTML='<span class="pg">p.'+n+'</span><span>'+esc(t)+'</span>';f.parentNode.insertBefore(s,f);f._slot=s;s._fig=f});

  /* 4) 기출 카드: 머리의 「대응 p.N」을 누를 수 있게(왼쪽 칸이 그 쪽으로) */
  var EX=$$('main div.q').filter(function(q){return !q.classList.contains('nq')&&!q.classList.contains('vq')&&!q.closest('.nh')});
  $$('main div.q').forEach(function(q){var sp=$('.qh>span',q);if(!sp)return;q._pg=pgOf(sp.textContent);
    sp.innerHTML=sp.innerHTML.replace(/p\.\s?(\d+)(?:\s*[–\-]\s*\d+)?/g,function(m,d){return '<a href="#" class="pgl" data-pg="'+d+'">'+m+'</a>'})});

  /* 4b) 마인드맵 탭(v3.1): 강의 → Part → 절(본문 h2) → 핵심 개념(Part 카드 · 옛 노트 개념). 개념은 카드 머리의 쪽 범위가 가장 많이 겹치는 절에
        (같은 Part 안에서, 안 겹치면 가장 가까운 절) 단다 — 따로 쓰는 것이 없다. 절 왼쪽 띠: 빨강 = 1순위 박스 · 파랑 = 동일 교수 기출이 있는 절.
        절의 쪽은 쪽 이미지가 왼쪽 칸으로 옮겨지기 전에 여기서 적어 두고, 그리기는 탭을 열 때 · 칸 너비가 바뀔 때 한다(아래 mmDraw) */
  var VM=$('#v-map'),MM={parts:[],secs:[],ncc:0,lec:''};
  function spanOf(s){var m=/p\.?\s*(\d+)(?:\s*[–\-~]\s*(\d+))?/.exec(s||'');return m?[+m[1],+(m[2]||m[1])]:null}
  function nkid(e,sel){var n=0;for(var c=e.firstElementChild;c;c=c.nextElementSibling)if(c.matches(sel))n++;return n}
  if(hasPart){var mp=null;
    [].forEach.call(M.children,function(e){
      if(e.tagName==='H1'){var t=e.textContent.replace(/\s+/g,' ').trim(),pm=/Part\s*(\d+[a-z]?)/.exec(t);
        if(e.classList.contains('nh')||!pm){mp=null;return}
        if(!MM.lec)MM.lec=t.replace(/\s*[—–-]\s*Part\s*\d.*$/,'');
        mp={n:pm[1],h1:e,secs:[]};MM.parts.push(mp);return}
      if(e.tagName!=='SECTION'||!mp)return;
      if(e.classList.contains('pack')){$$('div.cc',e).forEach(function(c){c._mp=mp});return}
      var h2=e.firstElementChild;if(!h2||h2.tagName!=='H2'||e.classList.contains('nh')||/(^|-)end$/.test(e.id))return;
      var c=h2.cloneNode(true),pg=$('.pg',h2),ps=figs.filter(function(f){return f._pg&&e.contains(f)}).map(function(f){return f._pg});
      $$('.pg',c).forEach(function(x){x.parentNode.removeChild(x)});
      var s={el:e,h2:h2,t:c.textContent.replace(/\s+/g,' ').trim(),sp:ps.length?[Math.min.apply(null,ps),Math.max.apply(null,ps)]:spanOf(pg&&pg.textContent),
        p1:nkid(e,'.p1,.p1d'),qs:nkid(e,'div.q.same'),ccs:[]};
      mp.secs.push(s);MM.secs.push(s)});

    size(root);place(root,10);
    var Hh=Math.ceil(root.sz+20),E=[],N=[];MMN=[];
    function cv(x1,y1,x2,y2){var m=(x1+x2)/2;return 'M'+x1+' '+y1.toFixed(1)+'C'+m+' '+y1.toFixed(1)+' '+m+' '+y2.toFixed(1)+' '+x2+' '+y2.toFixed(1)}
    (function walk(n){var ks=shut(n)?[]:n.kids,x=X[n.t];
      ks.forEach(function(k){E.push('<path class="mm-e" d="'+cv(x+n.w,n.cy,X[k.t],k.cy)+'"/>');walk(k)});
      var i=MMN.length,y=n.cy-n.h/2,mid=n.t==='r'||n.t==='p',ty=n.cy-(n.lines.length-1)*LH/2+4.2;MMN.push(n);
      var s='<g class="mm-n mm-'+n.t+(n.t==='c'?' '+n.ref.imp:'')+(n.bar?' b-'+n.bar:'')+'"'+(n.t!=='r'?' data-k="'+i+'" tabindex="0" role="link"':'')+'>'+
        '<title>'+esc(n.tip)+'</title><rect x="'+x+'" y="'+y.toFixed(1)+'" width="'+n.w+'" height="'+n.h+'" rx="'+(n.t==='c'?12:n.t==='r'?10:8)+'"/>';
      if(n.bar)s+='<rect class="mm-bar" x="'+(x+2)+'" y="'+(y+5).toFixed(1)+'" width="4" height="'+(n.h-10)+'" rx="2"/>';
      n.lines.forEach(function(l,j){s+='<text class="'+l.c+'" x="'+(mid?x+n.w/2:x+(n.t==='c'?12:11))+'" y="'+(ty+j*LH).toFixed(1)+'"'+(mid?' text-anchor="middle"':'')+'>'+esc(l.s)+'</text>'});
      s+='</g>';
      if(n.kids.length&&n.t!=='r'){var cx=x+n.w,z=shut(n);
        s+='<g class="mm-t" data-t="'+i+'" tabindex="0" role="button" aria-label="'+(z?'펼치기':'접기')+'"><circle cx="'+cx+'" cy="'+n.cy.toFixed(1)+'" r="8"/>'+
          '<text x="'+cx+'" y="'+(n.cy+3.5).toFixed(1)+'" text-anchor="middle">'+(z?n.kids.length:'−')+'</text></g>'}
      N.push(s)})(root);
    box.innerHTML='<svg class="mmx" viewBox="0 0 '+W+' '+Hh+'" width="'+W+'" height="'+Hh+'" role="img" aria-label="마인드맵: '+esc(MM.lec)+'">'+E.join('')+N.join('')+'</svg>';
    if(!again&&Math.abs(box.clientWidth-mmW)>8)mmDraw(true)}   /* 지도가 들어가며 세로 스크롤 막대가 생겨 칸이 좁아졌으면 한 번 더 */
  function mmAct(t,key){var n=MMN[+(t.getAttribute('data-t')||t.getAttribute('data-k'))];if(!n)return;
    if(t.hasAttribute('data-t')){var ref=n.ref;ref.shut=!ref.shut;mmDraw();
      if(key)MMN.forEach(function(m,j){if(m.ref===ref){var b=$('[data-t="'+j+'"]',VM);if(b)try{b.focus({preventScroll:true})}catch(x){}}});return}
    if(n.t==='c'){if(n.ref.el._ci!=null){setView('cards');showCard(n.ref.el._ci)}return}
    var el=n.t==='p'?n.ref.h1:n.ref.el;setView('c');if(!vis(el))unfilter();el.scrollIntoView({block:'start'});sync(true);flash(n.t==='p'?el:n.ref.h2)}
  if(MM.secs.length>1){
    VM.innerHTML='<h2 class="vt">마인드맵 <span class="pg">'+(MM.parts.length>1?'Part '+MM.parts.length+' · ':'')+'절 '+MM.secs.length+' · 개념 '+MM.ncc+'</span></h2>'+
      '<p class="why">'+(MM.parts.length>1?'강의 → Part → 절':'Part → 절')+(MM.ncc?' → 핵심 개념':'')+'. 절을 누르면 「개념 설명」의 그 절로'+
      (MM.ncc?', 개념을 누르면 「카드 복습」의 그 카드로 간다. 개념 색은 중요도(빨강 핵심 · 초록 중요 · 회색 참고)다.':' 간다.')+
      ' 절 왼쪽 띠는 그 절에 교수님 강조(빨강 — 1순위 박스)나 동일 교수 기출(파랑)이 있다는 표시다. ⊖를 누르면 그 가지가 접히고, 접힌 자리에는 가지 수가 남는다.</p><div class="mm"></div>';
    VM._enter=function(){var b=$('.mm',VM);if(!b.firstChild||Math.abs(b.clientWidth-mmW)>8)mmDraw()};
    VM.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-t],[data-k]');if(t&&VM.contains(t))mmAct(t,false)});
    VM.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var t=e.target.closest&&e.target.closest('[data-t],[data-k]');if(t){e.preventDefault();mmAct(t,true)}});
    var mmAll=function(ps,ss){MM.parts.forEach(function(p){p.shut=ps});MM.secs.forEach(function(s){s.shut=ss});mmDraw()};
    $('#mmA').onclick=function(){mmAll(false,false)};$('#mmS').onclick=function(){mmAll(false,true)};$('#mmP').onclick=function(){mmAll(true,false)};
    $('#mmS').hidden=!MM.ncc;$('#mmP').hidden=MM.parts.length<2;
    if(window.ResizeObserver)new ResizeObserver(function(){if(view==='map')VM._enter()}).observe(VM);
    else window.addEventListener('resize',function(){if(view==='map')VM._enter()});
  }

  /* 8) 탭 */
  var TB=$$('.tabs [role=tab]');
  function hasV(v){return v==='c'||(v==='p1'&&!!$('main section>.p1,main section>.p1d'))||(v==='q'&&EX.length>0)||(v==='quiz'&&!!VQ.firstChild)||(v==='cards'&&CC.length>0)||(v==='map'&&MM.secs.length>1)}
  TB.forEach(function(b){b.hidden=!hasV(b.getAttribute('data-v'));b.onclick=function(){setView(b.getAttribute('data-v'))}});
  var view='c',saved={},curPg=0,split=false,printing=false;
  function SC(){return split?PANE:(D.scrollingElement||D.documentElement)}
  function isMain(v){return v==='c'||v==='p1'||v==='q'}
  function anchors(){if(view==='q')return EX.filter(function(q){return q._pg&&vis(q)});
    if(view==='c'||view==='p1')return figs.map(function(f){return split?f._slot:f}).filter(vis);return []}
  function markEmpty(){var sel=view==='p1'?'.p1,.p1d':view==='q'?(B.classList.contains('same-only')?'.q.same':'.q'):'';
    $$('main section').forEach(function(s){var on=false;if(sel)for(var c=s.firstElementChild;c;c=c.nextElementSibling){if(c.matches(sel)){on=true;break}}s.classList.toggle('vh',!!sel&&!on)})}
  function setView(v,keep){if(v===view&&!keep)return;var sc=SC();saved[view]=sc.scrollTop;var from=view,pg=curPg;
    B.classList.remove('v-'+view);view=v;B.classList.add('v-'+v);
    TB.forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-v')===v)});
    markEmpty();closeMenu();
    if(v==='cards'&&VC._enter)VC._enter();
    if(v==='map'&&VM._enter)VM._enter();
    if(isMain(v)&&isMain(from)&&pg&&!keep){var as=anchors(),t=null;
      for(var i=0;i<as.length;i++){var p=as[i]._pg||0;if(p>=pg){t=as[i];break}}
      if(t){t.scrollIntoView({block:'start'});sync(true);return}}
    sc.scrollTop=keep?sc.scrollTop:(saved[v]||0);sync(true)}

  /* 9) 왼쪽 강의자료 칸 · 오른쪽을 읽는 자리에 맞춰 왼쪽 쪽을 따라 넘긴다 */
  function showPage(n,user){var f=byPg[n];if(!f)return false;
    if(!split){if(user)zoom(f);return true}
    if(curPg!==n||user){if(byPg[curPg])byPg[curPg].classList.remove('on');$$('.pslot.on').forEach(function(s){s.classList.remove('on')});
      f.classList.add('on');if(f._slot)f._slot.classList.add('on');curPg=n;
      var i=figs.indexOf(f);PI.textContent='p.'+n+' ('+(i+1)+'/'+figs.length+')';
      var top=f.offsetTop-8;try{PL.scrollTo({top:top,behavior:user?'smooth':'auto'})}catch(x){PL.scrollTop=top}}
    return true}
  var tk=false;
  function sync(now){if(tk&&!now)return;tk=true;(now?function(f){f()}:function(f){window.requestAnimationFrame(f)})(function(){tk=false;
    /* 쪽 머리가 화면 위쪽 40% 안으로 올라오면 그 쪽을 읽는 중으로 본다 */
    var as=anchors();if(!as.length)return;var R=split?PANE.getBoundingClientRect():{top:0,height:window.innerHeight},lim=R.top+Math.max(130,R.height*.4),pick=as[0];
    for(var i=0;i<as.length;i++){if(as[i].getBoundingClientRect().top<=lim)pick=as[i];else break}
    var n=pick._pg||0;if(!n)return;if(split)showPage(n,false);else curPg=n})}
  PANE.addEventListener('scroll',function(){if(split)sync()},{passive:true});
  window.addEventListener('scroll',function(){if(!split)sync()},{passive:true});
  function layout(){var on=!!(mq&&mq.matches)&&!printing&&figs.length>0;if(on===split)return;
    var keepPg=on&&(D.scrollingElement||D.documentElement).scrollTop<60?0:curPg;split=on;B.classList.toggle('split',on);$('#pdfT').hidden=!on||!B.classList.contains('nopdf');
    figs.forEach(function(f){if(on)PL.appendChild(f);else f._slot.parentNode.insertBefore(f,f._slot.nextSibling)});
    if(on){var lw=LS.get('v3lw');if(lw)B.style.setProperty('--lw',lw);curPg=0;
      if(keepPg&&byPg[keepPg]){var s=byPg[keepPg]._slot;if(s&&vis(s))s.scrollIntoView({block:'start'})}sync(true);if(!curPg&&figs[0])showPage(figs[0]._pg,false)}}
  var mq=window.matchMedia?window.matchMedia('(min-width: 760px)'):null;
  if(mq){if(mq.addEventListener)mq.addEventListener('change',layout);else if(mq.addListener)mq.addListener(layout)}
  window.addEventListener('resize',layout);  /* 화면 회전 · 창 크기 변경(같은 상태면 아무 일도 하지 않는다) */
  layout();
  $('#pvB').onclick=function(){var i=figs.indexOf(byPg[curPg]);if(i>0)showPage(figs[i-1]._pg,true)};
  $('#nxB').onclick=function(){var i=figs.indexOf(byPg[curPg]);if(i<figs.length-1)showPage(figs[i+1]._pg,true)};
  function pdfOn(on){B.classList.toggle('nopdf',!on);$('#pdfT').hidden=on||!split;LS.set('v3nopdf',on?'':'1')}
  $('#pdfX').onclick=function(){pdfOn(false)};$('#pdfT').onclick=function(){pdfOn(true);sync(true)};
  if(LS.get('v3nopdf'))pdfOn(false);
  /* 칸 너비: 가운데 막대를 끌어서(22~72%) — 이 기기에 기억 */
  var G=$('#gut');G.onpointerdown=function(e){if(!split)return;e.preventDefault();try{G.setPointerCapture(e.pointerId)}catch(x){}
    var mv=function(ev){var w=Math.max(22,Math.min(72,ev.clientX*100/window.innerWidth));B.style.setProperty('--lw',w.toFixed(1)+'%')};
    var up=function(){G.removeEventListener('pointermove',mv);G.removeEventListener('pointerup',up);G.removeEventListener('pointercancel',up);
      LS.set('v3lw',B.style.getPropertyValue('--lw'))};
    G.addEventListener('pointermove',mv);G.addEventListener('pointerup',up);G.addEventListener('pointercancel',up)};

  /* 10) 확대 보기: 쪽 이미지 · 기출 그림을 누르면 화면 가득 */
  var ZV=null;
  function zoom(f){var im=$('img',f);if(!im||!im.getAttribute('src'))return;if(!ZV){ZV=D.createElement('div');ZV.id='zv';ZV.innerHTML='<img alt=""><p></p>';
      ZV.onclick=function(){ZV.hidden=true};B.appendChild(ZV)}
    $('img',ZV).src=im.src;$('img',ZV).alt=im.alt;var c=$('figcaption',f);$('p',ZV).textContent=c?c.textContent:'';ZV.hidden=false}
  D.addEventListener('keydown',function(e){if(e.key==='Escape'&&ZV)ZV.hidden=true});

  /* 11) 누르기: 쪽 표시 → 왼쪽 칸(좁은 화면은 확대) · 박스/기출 링크 → 그 자리가 보이는 탭으로 · 개념 카드 링크 → 카드 복습 */
  function flash(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
  function where(el){if(VQ.contains(el))return 'quiz';if(VC.contains(el))return 'cards';return null}
  function unfilter(){['no-q','no-qd','same-only','ngq','ngz','hide-ai'].forEach(function(c){B.classList.remove(c);var b=$('[data-c="'+c+'"]');if(b)b.setAttribute('aria-pressed',false)});markEmpty()}
  function go(el){var w=where(el);
    if(w)setView(w);
    else if(!vis(el)){var q=el.closest('div.q');setView(q&&(view==='q'||view==='quiz')?'q':'c');if(!vis(el))unfilter();if(!vis(el)&&view!=='c')setView('c')}
    el.scrollIntoView({block:'start'});flash(el)}
  D.addEventListener('click',function(e){var t=e.target;
    if(t.closest('#menuB')){toggleMenu();return}
    if(!t.closest('#menu'))closeMenu();
    var fg=t.closest('figure.slide');if(fg&&t.tagName==='IMG'){zoom(fg);if(split&&fg._pg)showPage(fg._pg,false);return}
    var pl=t.closest('.pgl,.pslot');if(pl){e.preventDefault();showPage(+pl.getAttribute('data-pg'),true);return}
    var a=t.closest('a[href^="#"]');
    if(a){var h=a.getAttribute('href');if(h.length<2)return;var el=D.getElementById(decodeURIComponent(h.slice(1)));if(!el)return;e.preventDefault();
      if(el.matches('figure.slide')){showPage(el._pg||pgOf(el.id.replace(/.*pg/,'p')),true);return}
      if(el.classList.contains('cc')&&el._ci!=null){setView('cards');showCard(el._ci);return}
      go(el);return}
    var sp=t.closest('span.pg');if(sp&&!t.closest('#pdf')&&!t.closest('.vt')&&!t.closest('h3')){var n=pgOf(sp.textContent)||+((sp.textContent.match(/\d+/)||[0])[0]);if(n&&byPg[n]){e.preventDefault();showPage(n,true)}}
  });

  /* 12) 세부 버튼(탭마다) · 더 보기 메뉴 */
  $$('.sub [data-c]').forEach(function(b){b.onclick=function(){var c=b.getAttribute('data-c');b.setAttribute('aria-pressed',B.classList.toggle(c));
    var nq=$('[data-c="no-qd"]');if(nq)nq.classList.toggle('dim',B.classList.contains('no-q'));markEmpty();sync(true)}});
  var MN=$('#menu'),MB=$('#menuB');
  function closeMenu(){MN.hidden=true;MB.setAttribute('aria-expanded',false)}
  function toggleMenu(){MN.hidden=!MN.hidden;MB.setAttribute('aria-expanded',!MN.hidden)}
  function scope(){return view==='quiz'?VQ:view==='cards'?VC:M}
  function ans(o){$$('details.ans,.recall details',scope()).forEach(function(d){d.open=o})}
  $('#ansO').onclick=function(){ans(true);closeMenu()};$('#ansC').onclick=function(){ans(false);closeMenu()};
  $('#easyO').onclick=function(){var ds=$$('details.easy',M),o=ds.some(function(d){return !d.open});ds.forEach(function(d){d.open=o});
    this.textContent=o?'쉬운 설명 모두 접기':'쉬운 설명 모두 펼치기';closeMenu()};
  $('#exam').onclick=function(){this.setAttribute('aria-pressed',B.classList.toggle('exam'));closeMenu()};
  $('#prn').onclick=function(){closeMenu();window.print()};

  /* 13) 노트만 따로 연 경우: 쪽·박스 링크를 그 쪽이 든 Part 파일(data-file)로 */
  $$('a[data-file]').forEach(function(a){var h=a.getAttribute('href');
    if(a.getAttribute('data-file')&&h&&h.charAt(0)==='#'&&!D.getElementById(decodeURIComponent(h.slice(1))))a.setAttribute('href',a.getAttribute('data-file')+h)});

  /* 14) 인쇄·PDF 변환: 한 줄 화면으로 돌려 쪽 이미지를 설명 앞에 두고, 정답을 펼친다(시험지 모드 제외) — 지금 탭만 인쇄 */
  function onPrint(){if(printing)return;printing=true;layout();$$('details.easy').forEach(function(d){d._o=d.open;d.open=true});if(!B.classList.contains('exam'))ans(true)}
  function afterPrint(){if(!printing)return;printing=false;$$('details.easy').forEach(function(d){d.open=!!d._o});layout()}
  window.addEventListener('beforeprint',onPrint);window.addEventListener('afterprint',afterPrint);
  markEmpty();sync(true);
})();
</script>
</body>
